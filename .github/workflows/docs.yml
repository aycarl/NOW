name: Live Web Sanctuary & Documentation Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'docs/**'
      - 'pubspec.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-web-and-docs:
    name: Build Live Flutter Web App & Feature Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build N:OW Flutter Web App (Live Sanctuary)
        run: flutter build web --release --base-href "/NOW/"

      - name: Bundle Feature Docs & API Reference under /docs and /api
        run: |
          dart doc --output=build/web/api
          mkdir -p build/web/docs
          cp -R docs/* build/web/docs/
          cp CHANGELOG.md build/web/docs/CHANGELOG.md || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy Live Web App to GitHub Pages
    needs: build-web-and-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
