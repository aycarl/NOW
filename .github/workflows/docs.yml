name: Documentation & API Reference Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Feature Docs & Dart API Reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies & generate DartDoc
        run: |
          flutter pub get
          dart doc --output=build/site/api

      - name: Assemble Documentation Portal
        run: |
          mkdir -p build/site/docs
          cp -R docs/* build/site/docs/
          cp README.md build/site/index.md || true
          cp CHANGELOG.md build/site/CHANGELOG.md || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
