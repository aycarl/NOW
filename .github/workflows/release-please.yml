name: Release Please & Multi-Platform Artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Google Release Please (SemVer PR & Tag)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Google Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-android:
    name: Build Android Release (APK & Play AppBundle)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK & AppBundle
        run: |
          flutter build apk --release \
            --build-name=${{ needs.release-please.outputs.version }} \
            --build-number=${{ github.run_number }}
          flutter build appbundle --release \
            --build-name=${{ needs.release-please.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Attach Android Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  build-apple:
    name: Build macOS (.app.zip) & iOS Release Archive
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-14
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Desktop App Archive
        run: |
          flutter build macos --release \
            --build-name=${{ needs.release-please.outputs.version }} \
            --build-number=${{ github.run_number }}
          cd build/macos/Build/Products/Release
          zip -r NOW-macOS-${{ needs.release-please.outputs.tag_name }}.app.zip NOW.app

      - name: Build iOS Release (No-Codesign Archive for CI Verification)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.release-please.outputs.version }} \
            --build-number=${{ github.run_number }}
          cd build/ios/iphoneos
          zip -r NOW-iOS-Unsigned-${{ needs.release-please.outputs.tag_name }}.app.zip Runner.app

      - name: Attach Apple Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            build/macos/Build/Products/Release/NOW-macOS-${{ needs.release-please.outputs.tag_name }}.app.zip
            build/ios/iphoneos/NOW-iOS-Unsigned-${{ needs.release-please.outputs.tag_name }}.app.zip
